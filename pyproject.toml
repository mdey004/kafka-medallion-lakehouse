[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-medallion-lakehouse"
version = "0.1.0"
description = "Kafka -> Delta Lake medallion (Bronze/Silver/Gold) pipeline with SCD Type 2 and a star schema"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
]

[project.optional-dependencies]
producer = ["confluent-kafka>=2.4"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
medallion = "medallion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
